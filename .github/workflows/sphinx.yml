name: Documentation

# Builds the Sphinx site from docs/ and publishes it to GitHub Pages.
#
# Deployment is deliberately not triggered by a push to main: the site embeds
# download links for a specific release tag (see docs/conf.py), so publishing it
# before those assets exist would ship 404s. It is called by release.yml once
# the release assets are up, and can be run by hand from the Actions tab after
# editing docs/.

on:
  workflow_call:
    inputs:
      verify_links:
        description: Fail when a release download link in the built site does not resolve
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      verify_links:
        description: Fail when a release download link in the built site does not resolve
        required: false
        type: boolean
        default: false

permissions: {}

# One publisher at a time: a manual run and a release run both push to
# gh-pages, and two concurrent pushes would race on the same branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.9'

      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python3 -m pip install -r ./docs/requirements.txt

      - name: Patch Pygments
        run: cp docs/lexer.py $(pip3 show pygments | grep Location | awk -F " " '{print $2}')/pygments/lexers/wren.py

      - name: Sphinx build
        run: sphinx-build -M html docs/ build/

      # Checks the links the site actually renders, not the ones conf.py meant
      # to render, so a renamed artifact is caught too. Non-fatal for a manual
      # run (a version bump before its tag legitimately 404s), fatal during a
      # release.
      - name: Check release download links
        env:
          VERIFY_LINKS: ${{ inputs.verify_links }}
        run: |
          if [ "${VERIFY_LINKS}" = "true" ]; then
            python3 tools/check_release_urls.py build/html
          else
            python3 tools/check_release_urls.py build/html --warn-only
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/html
          cname: bialet.dev
