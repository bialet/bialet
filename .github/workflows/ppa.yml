name: PPA

# Builds a signed Debian source package for a release tag and uploads it to
# ppa:bialet/bialet. Launchpad builds the binaries for each series and
# architecture; this workflow only produces the _source.changes.
#
# It is called by release.yml after the GitHub release is created, and can be
# run by hand from the Actions tab to (re)publish a specific tag. It must not
# use `on: release: published`: a release created with the default
# GITHUB_TOKEN does not trigger other workflows.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   PPA_GPG_KEY     base64 of the ASCII-armored private upload key
#   PPA_GPG_KEY_ID  key id or fingerprint used to sign
#
# The key's email must be a verified address on the Launchpad account, and the
# public key must be added to that account. Until PPA_GPG_KEY exists the job
# builds and lints an unsigned source package, then skips the upload.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish (for example v1.2.11)
        required: true
        type: string
      dry_run:
        description: Build and lint the source package without uploading
        required: false
        type: boolean
        default: false
      series:
        description: JSON array of Ubuntu series to publish
        required: false
        type: string
        default: '["jammy","noble","resolute","stonking"]'

    secrets:
      PPA_GPG_KEY:
        required: false
      PPA_GPG_KEY_ID:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v1.2.11)
        required: true
        type: string
      dry_run:
        description: Build and lint the source package without uploading
        type: boolean
        default: false
      series:
        description: JSON array of Ubuntu series to publish
        required: false
        type: string
        default: '["jammy","noble","resolute","stonking"]'


permissions:
  contents: read

concurrency:
  group: ppa-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # A release call already verified actions.lock before it started. A manual
  # dispatch did not: it checked out and signed with the PPA key using tag-pinned
  # actions nobody had compared with the lockfile. Verify first on that path.
  lockfile:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lockfile.yml

  upload:
    needs: lockfile
    # Prerelease tags (for example v1.2.11-rc.1) never go to the PPA. The job
    # runs when the lockfile check passed or was skipped (a release call), never
    # when it failed.
    if: ${{ !failure() && !cancelled() && !contains(inputs.tag, '-') }}
    runs-on: ubuntu-24.04
    # A manual dispatch publishes signed packages, so gate it like a release.
    environment: release
    strategy:
      fail-fast: false
      # Every series uploads the same bialet_<version>.orig.tar.gz filename to
      # the same Launchpad incoming directory. The tarball is reproducible, so
      # the contents match, but keep the uploads sequential so two dputs never
      # write that file at the same time.
      max-parallel: 1
      matrix:
        series: ${{ fromJSON(inputs.series) }}
    env:
      DEBEMAIL: "Rodrigo Arce <rsarce@gmail.com>"
      DEBFULLNAME: "Rodrigo Arce"
      PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
      PPA_GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
      # Passed through the environment rather than interpolated into run steps,
      # so a crafted tag or series string cannot reach the shell as code.
      TAG: ${{ inputs.tag }}
      SERIES: ${{ matrix.series }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # An explicit tag ref, not the bare name: checkout resolves a branch
          # before a tag, so a branch called v1.3.0 would win.
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # A manual dispatch must not sign code that is not the reviewed tag. The
      # release workflow already guards its call, but a dispatch bypasses that.
      - name: Tag must be on main
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          if [ "$(git rev-parse HEAD)" != "${TAG_SHA}" ]; then
            echo "::error::checked out $(git rev-parse HEAD), but tag ${TAG} is ${TAG_SHA}"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            echo "::error::tag ${TAG} points at a commit that is not on main"
            exit 1
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dput-ng lintian gnupg

      - name: Check the signing key is configured
        id: key
        run: |
          if [ -z "${PPA_GPG_KEY}" ]; then
            echo "::warning::PPA_GPG_KEY is not set; building an unsigned package and skipping the upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${PPA_GPG_KEY_ID}" ]; then
            echo "::error::PPA_GPG_KEY_ID is empty but PPA_GPG_KEY is set."
            exit 1
          fi

      - name: Check the tag and derive the version
        run: |
          # Both values end up in $GITHUB_ENV, one assignment per line. A
          # newline in either would add assignments of its own choosing to the
          # job that holds the signing key, so each must be a single plain
          # token. (A glob such as v[0-9]* also matches across a newline.)
          if ! [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::expected a version tag like v1.2.3"
            exit 1
          fi
          if ! [[ "${SERIES}" =~ ^[a-z]+$ ]]; then
            echo "::error::expected an Ubuntu series name such as noble"
            exit 1
          fi
          V="${TAG#v}"
          echo "V=${V}" >> "$GITHUB_ENV"
          echo "VERSION=${V}-1~${SERIES}1" >> "$GITHUB_ENV"

          # The binary and the package must report the same version.
          grep -q "BIALET_VERSION \"${V}\"" src/bialet.h \
            || { echo "::error::src/bialet.h is not at ${V}"; exit 1; }

      - name: Build the upstream tarball without debian/
        run: |
          mkdir -p "/tmp/orig/bialet-${V}"
          git archive HEAD | tar -x -C "/tmp/orig/bialet-${V}"
          # dpkg-source rejects an .orig tarball that contains debian/.
          rm -rf "/tmp/orig/bialet-${V}/debian"
          # Every series uploads this same filename, so the bytes have to be
          # identical: pin mtimes/ownership and drop the gzip timestamp.
          # Otherwise Launchpad sees different contents for the same file and
          # rejects all but the first upload.
          tar -C /tmp/orig --sort=name --mtime=@0 --owner=0 --group=0 \
              --numeric-owner -cf - "bialet-${V}" \
            | gzip -n -9 > "../bialet_${V}.orig.tar.gz"

      - name: Add the changelog entry
        run: |
          dch --newversion "${VERSION}" \
              --distribution "${SERIES}" \
              "New upstream release ${V}."

      - name: Build the source package
        run: |
          if [ -z "${PPA_GPG_KEY}" ]; then
            dpkg-buildpackage -S -sa -d -us -uc
          else
            export GNUPGHOME=/tmp/gnupg
            mkdir -m 700 "$GNUPGHOME"
            # The upload step's dput re-verifies the .changes signature, so the
            # agent home has to survive to the next step.
            echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
            printf '%s' "${PPA_GPG_KEY}" | base64 -d | gpg --batch --import
            # A key with a passphrase needs gpg-agent to have it cached; use a
            # dedicated key without one for unattended uploads.
            dpkg-buildpackage -S -sa -d -k"${PPA_GPG_KEY_ID}"
          fi

      - name: Lintian
        run: |
          lintian --fail-on error "../bialet_${VERSION}_source.changes"

      - name: Upload to Launchpad
        if: steps.key.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          dput ppa:bialet/bialet "../bialet_${VERSION}_source.changes"
