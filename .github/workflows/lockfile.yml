name: Lockfile

# Verifies .github/workflows/actions.lock against the workflows and upstream.
#
# The workflows pin actions to version tags (vX.Y.Z); the lockfile records the
# commit each tag resolves to, so a retagged or tampered tag fails here instead
# of running silently in the release workflow.
#
# After adding or changing an action in a workflow, run `gh actions-lock` and
# commit the updated lockfile.

on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  lockfile:
    name: Verify actions.lock
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        # Pinned to a commit, not the tag: this job exists to catch a retagged
        # action, so it must not select its own code by a retaggable ref.
        run: gh extension install github/gh-actions-lock --pin 04b7a1a4d00b339dd3ff903bb4d78d4066b2bac7

      - name: Verify lockfile
        run: gh actions-lock --verify
