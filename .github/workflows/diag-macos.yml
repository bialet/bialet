name: Diag macOS cron reload

on:
  workflow_dispatch:

jobs:
  diag:
    name: Reproduce macOS cron reload delay
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install openssl

      - name: Build
        run: make clean && make

      - name: Run test suite
        run: ./tests/run.sh ./build/bialet
